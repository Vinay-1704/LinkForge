services:
  - type: web
    name: linkforge-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: linkforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://link-forge-eight.vercel.app,http://localhost:5173
      - key: UPLOAD_DIR
        value: uploads

databases:
  - name: linkforge-db
    databaseName: linkforge
    plan: free
